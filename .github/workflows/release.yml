name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Pre-release tags like v0.4.0-beta
  workflow_dispatch:
    # Dispatch runs are DRY-RUN ONLY: they build and validate but never publish
    # a GitHub Release (see the `release` job's `if:`). This prevents a human
    # from minting a mistagged release straight off default-branch HEAD.
    inputs:
      version:
        description: 'Version to build (e.g., 0.5.0) — dry-run only, does not publish'
        required: true
        type: string
      ref:
        description: 'Exact git ref (tag/branch/SHA) to check out and build'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On tag-push this input is empty and checkout uses the triggering
          # tag; on workflow_dispatch it pins the exact ref the human named.
          ref: ${{ github.event.inputs.ref }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (tag: $TAG)"

      - name: Verify Cargo.toml version matches
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          EXPECTED="${{ steps.version.outputs.version }}"
          # Strip any pre-release suffix for comparison
          EXPECTED_BASE=$(echo "$EXPECTED" | sed 's/-.*//')
          if [ "$CARGO_VERSION" != "$EXPECTED_BASE" ]; then
            echo "Error: Tag version ($EXPECTED_BASE) doesn't match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $CARGO_VERSION"

  build:
    name: Build XCFramework
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-release

      # QUALITY GATES (fail-closed): a release must not be built from code that
      # fails formatting, lint, or tests. No continue-on-error, no `|| true`.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build XCFramework
        run: ./scripts/build-ios.sh

      # DRIFT GATE (fail-closed): semantically typecheck the freshly generated
      # UniFFI bindings TOGETHER with the shipped high-level wrapper, importing
      # the generated FFI module map. If the wrapper references an API the
      # regenerated bindings no longer expose (or vice versa), this fails the
      # release instead of shipping a broken Sources/ directory. (-typecheck,
      # not -parse: -parse is syntax-only and misses missing-method drift.)
      - name: Check bindings/wrapper API drift
        run: |
          swiftc -typecheck \
            -sdk "$(xcrun --show-sdk-path --sdk macosx)" \
            -I target/xcframework/headers \
            target/xcframework/pocket_tts_ios.swift \
            swift/PocketTTSSwift.swift

      - name: Download model files from HuggingFace
        run: |
          pip install huggingface_hub
          python scripts/download-model.py --output-dir ./models/kyutai-pocket-ios

      - name: Verify build outputs
        run: |
          echo "Checking build outputs..."
          ls -la target/xcframework/

          if [ -d "target/xcframework/PocketTTS.xcframework" ]; then
            echo "XCFramework created successfully"
            du -sh target/xcframework/PocketTTS.xcframework
          else
            echo "XCFramework not found"
            exit 1
          fi

          if [ -f "target/xcframework/pocket_tts_ios.swift" ]; then
            echo "Swift bindings generated"
          else
            echo "Swift bindings not found"
            exit 1
          fi

      - name: Package release
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ needs.validate.outputs.version }}"

      # PROVENANCE CHECK: confirm the packaged BUILD_INFO.txt records the same
      # commit this workflow is running against. On tag-push GITHUB_SHA is the
      # commit the tag points to; the packaged git_sha must match it exactly.
      - name: Verify BUILD_INFO provenance
        if: github.event_name == 'push'
        run: |
          RELEASE_DIR="release/PocketTTS-v${{ needs.validate.outputs.version }}"
          BUILD_INFO="$RELEASE_DIR/BUILD_INFO.txt"
          if [ ! -f "$BUILD_INFO" ]; then
            echo "Error: $BUILD_INFO not found"
            exit 1
          fi
          PACKAGED_SHA=$(grep '^git_sha:' "$BUILD_INFO" | awk '{print $2}')
          echo "Packaged git_sha: $PACKAGED_SHA"
          echo "GITHUB_SHA:       $GITHUB_SHA"
          if [ "$PACKAGED_SHA" != "$GITHUB_SHA" ]; then
            echo "Error: BUILD_INFO.txt git_sha ($PACKAGED_SHA) != GITHUB_SHA ($GITHUB_SHA)"
            exit 1
          fi
          echo "Provenance verified."

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            release/PocketTTS-v${{ needs.validate.outputs.version }}.zip
            release/PocketTTS-v${{ needs.validate.outputs.version }}.zip.sha256
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [validate, build]
    # Publish ONLY on tag-push. workflow_dispatch runs are dry-run: they build
    # and validate the artifact but never create a GitHub Release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"

          # Create release notes file
          cat > release_notes.md << 'HEADER'
          ## Pocket TTS iOS Beta Release

          This is a beta release of the Pocket TTS iOS XCFramework for text-to-speech synthesis.

          HEADER

          # Extract changelog section for this version
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "### Changes" >> release_notes.md
            echo "" >> release_notes.md
            sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 | tail -n +2 >> release_notes.md
          fi

          # Add installation instructions
          cat >> release_notes.md << 'INSTALL'

          ## Installation

          1. Download `PocketTTS-vX.Y.Z.zip` from the assets below
          2. Extract the archive
          3. Add `PocketTTS.xcframework` to your Xcode project
          4. Add Swift files from `Sources/` directory to your project
          5. See included README.md for detailed integration instructions

          ## Requirements

          - iOS 17.0+
          - Xcode 15+

          ## Included

          - XCFramework (device + simulator)
          - Swift bindings
          - Model files (~226MB)

          ## Checksums

          ```
          INSTALL

          cat release/PocketTTS-v$VERSION.zip.sha256 >> release_notes.md
          echo '```' >> release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Pocket TTS iOS ${{ needs.validate.outputs.tag }}
          body_path: release_notes.md
          files: |
            release/PocketTTS-v${{ needs.validate.outputs.version }}.zip
            release/PocketTTS-v${{ needs.validate.outputs.version }}.zip.sha256
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
